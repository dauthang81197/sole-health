# Deploy target: the dedicated Linux server that already runs Postgres + Redis
# as separate containers. This file only runs the app services — it does NOT
# define postgres/redis, it connects to the ones already on the server via an
# external Docker network.
#
# Usage on the server:
#   1. docker network inspect <existing-network> to confirm the network name
#      your Postgres/Redis containers are on (or create one and attach them).
#   2. cp .env.production.example .env.production, fill in real values
#      (DOCKERHUB_USERNAME, DB_HOST/REDIS_HOST = the existing containers'
#      names or reachable host, EXISTING_INFRA_NETWORK = network name from
#      step 1).
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production pull
#   4. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# No CI-driven auto-deploy yet (by choice, for now) — this is a manual pull +
# up until that's wired up.

services:
  iam-service:
    image: ${DOCKERHUB_USERNAME}/sole-health-iam-service:latest
    restart: unless-stopped
    env_file: iam-service.env
    ports:
      - '3000:3000'
    networks:
      - infra

  notification-service:
    image: ${DOCKERHUB_USERNAME}/sole-health-notification-service:latest
    restart: unless-stopped
    env_file: notification-service.env
    ports:
      - '3001:3001'
    networks:
      - infra

  task-service:
    image: ${DOCKERHUB_USERNAME}/sole-health-task-service:latest
    restart: unless-stopped
    env_file: task-service.env
    ports:
      - '3002:3002'
    networks:
      - infra

networks:
  infra:
    external: true
    name: ${EXISTING_INFRA_NETWORK}
