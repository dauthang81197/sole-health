name: Task Service

on:
  push:
    branches: [develop, main]
    paths: ['task-service/**']
  pull_request:
    paths: ['task-service/**']

jobs:
  ci:
    uses: ./.github/workflows/_backend-service-ci.yml
    with:
      service-path: task-service
      image-name: sole-health-task-service
    secrets: inherit
