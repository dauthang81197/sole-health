name: IAM Service

on:
  push:
    branches: [develop, main]
    paths: ['backend/iam-service/**']
  pull_request:
    paths: ['backend/iam-service/**']

jobs:
  ci:
    uses: ./.github/workflows/_backend-service-ci.yml
    with:
      service-path: backend/iam-service
      image-name: sole-health-iam-service
    secrets: inherit
