name: Notification Service

on:
  push:
    branches: [develop, main]
    paths: ['notification-service/**']
  pull_request:
    paths: ['notification-service/**']

jobs:
  ci:
    uses: ./.github/workflows/_backend-service-ci.yml
    with:
      service-path: notification-service
      image-name: sole-health-notification-service
    secrets: inherit
